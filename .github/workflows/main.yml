name: Finanzas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crear proyecto npm
        run: npm init -y

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core
          npm install --save-dev @capacitor/cli
          npm install @capacitor/android

      - name: Inicializar Capacitor
        run: npx cap init Finanzas com.finanzas.app --web-dir="."

      - name: Agregar Android
        run: npx cap add android

      - name: Copiar archivos web a Android
        run: npx cap copy

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Finanzas-APK-descargable
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
